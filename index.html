<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Atlas — a world of photographs</title>
    <meta name="description" content="Spin the globe, open a country, watch its photographs play like a film.">
</head>
<body>
    <div id="blob"></div>
    <div id="globe"></div>

    <header id="masthead">
        <h1>ATLAS</h1>
        <p>Spin · Choose a country · Watch</p>
    </header>

    <a id="back-link" class="pill" href="https://nilshogberg.vercel.app">← Portfolio</a>
    <button id="tour-play" class="pill" hidden>World tour</button>
    <div id="hint" class="pill">drag to spin · click a country</div>

    <div id="boot"><span>Loading the world…</span></div>

    <script type="module" src="/src/main.js"></script>
    <!-- Vercel Analytics + Speed Insights -->
    <script defer src="/_vercel/insights/script.js"></script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
