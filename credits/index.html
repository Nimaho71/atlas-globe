<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Credits — Atlas</title>
    <meta name="description" content="Every photograph in Atlas, with its photographer and licence.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">

</head>
<body>
    <header>
        <a class="back" href="/">← Back to the globe</a>
        <h1>Credits</h1>
        <p class="lede">
            Every photograph here was made by someone else and published on

        <p class="count" id="count"></p>
    </header>

    <main id="list"></main>

    <footer>
        <p>Built by Nils Högberg · photographs remain the work of their authors.</p>
    </footer>

    <script type="module" src="./credits.js"></script>
